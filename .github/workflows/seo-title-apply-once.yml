name: Aplicar título SEO principal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-title-apply-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Cambiar título SEO
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('api/seo-proxy.js')
          text = p.read_text(encoding='utf-8')
          old = "title: 'Emiliana Restaurant | Buffet Cultural en Cusco'"
          new = "title: 'Emiliana Restaurante Buffet Cultural Cusco | Gastronomía, Danzas y Reservas'"
          if old not in text:
              raise SystemExit('No se encontró el título anterior')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check api/seo-proxy.js
      - name: Guardar cambio y retirar workflow temporal
        shell: bash
        run: |
          rm .github/workflows/seo-title-apply-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/seo-proxy.js .github/workflows/seo-title-apply-once.yml
          git commit -m 'seo: actualizar título principal de Emiliana'
          git push origin HEAD:main
