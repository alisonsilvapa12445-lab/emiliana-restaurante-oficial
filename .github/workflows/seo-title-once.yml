name: Actualizar título SEO una vez

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-title-once.yml'

permissions:
  contents: write

jobs:
  update-seo-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Actualizar título principal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('api/seo-proxy.js')
          text = p.read_text(encoding='utf-8')
          old = "title: 'Emiliana Restaurant | Buffet Cultural en Cusco'"
          new = "title: 'Emiliana Restaurante Buffet Cultural Cusco | Gastronomía, Danzas y Reservas'"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Se esperaba 1 coincidencia del título anterior y se encontraron {count}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Ejecutar verificaciones
        run: npm test

      - name: Confirmar y guardar cambio
        shell: bash
        run: |
          rm .github/workflows/seo-title-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/seo-proxy.js .github/workflows/seo-title-once.yml
          git commit -m 'seo: optimizar título principal de Emiliana'
          git push origin HEAD:main
